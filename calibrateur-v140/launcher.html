<!doctype html><html lang="fr"><meta charset="utf-8"><style>body{background:#222639;color:#eee;font:13px system-ui;padding:8px}button{background:#b5a5ff;color:#201a35;border:0;border-radius:6px;padding:9px;width:100%;font:inherit;font-weight:bold}</style><button id="open" disabled>Ouvrir le calibrateur V1.4</button><p id="status"></p><script type="module">import OBR from "https://esm.sh/@owlbear-rodeo/sdk@3";const b=document.getElementById("open"),s=document.getElementById("status");async function open(){try{const w=await OBR.viewport.getWidth();await OBR.popover.open({id:"fr.toniogervais.calibrateur/panel",url:new URL("index.html?v=140",location.href).href,width:420,height:630,anchorReference:"POSITION",anchorPosition:{left:Math.max(10,w-20),top:70},anchorOrigin:{horizontal:"RIGHT",vertical:"TOP"},transformOrigin:{horizontal:"RIGHT",vertical:"TOP"},disableClickAway:true});s.textContent="Sélectionne un token sur la carte."}catch(e){s.textContent=e.message||String(e)}}OBR.onReady(async()=>{if(await OBR.player.getRole()!=="GM"){s.textContent="Réservé au MJ.";return}b.disabled=false;b.onclick=open;await open()});</script></html>
