<!doctype html><html lang="fr"><head>

<title>Invitation aux Archives</title>
<style>body{font:15px "Segoe UI",system-ui,sans-serif;margin:0;padding:24px;background:#18121f;color:#f3e7ca;text-align:center}
h1{font-size:19px;line-height:1.4}p{font-size:13px;line-height:1.5}

<h1>Le maître de jeu vous invite à revenir aux Archives</h1>
<a target="archives-main" href="https://toniogervais.github.io/archives-owlbear/archives-app-v56-v47.html">Revenir aux Archives</a>
<button type="button" id="stay">Rester sur Owlbear</button>
<script type="module">
import { O as OBR } from "./assets/index-BfJgTiPE.js";
import { focusArchives } from "./src/v41/focus-archives.mjs";
const link=document.querySelector('a[target="archives-main"]');
link.addEventListener("click",event=>{
  if(focusArchives(link.href))event.preventDefault();
});
await new Promise(resolve=>OBR.onReady(resolve));
document.getElementById("stay").addEventListener("click",()=>OBR.modal.close("fr.archives-imaginaire.bridge/return-invite"));
</script></body></html>
