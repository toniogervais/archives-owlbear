<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calibrateur de scène</title><style>*{box-sizing:border-box}body{margin:0;padding:12px;background:#222639;color:#eee;font:13px system-ui}h1{font-size:16px;margin:0 0 10px}p{margin:6px 0;line-height:1.4}small,.muted{color:#b6bad1}fieldset{border:1px solid #464b64;border-radius:8px;padding:9px;margin:8px 0}legend{color:#c6c3df;font-size:11px}button,input,select{font:inherit;border:1px solid #4b5069;color:#eee;background:#171b2a;border-radius:6px;padding:8px;min-width:0}input,select{width:100%}button{cursor:pointer;background:#363d56}button.primary{background:#b5a5ff;color:#201a35;font-weight:700}button:disabled,input:disabled,select:disabled{opacity:.45;cursor:default}.row{display:flex;gap:6px;margin:6px 0}.row>*{flex:1}label{display:block;font-size:11px;margin-bottom:3px}.check{display:flex;gap:6px;align-items:center;font-size:11px}.check input{width:auto}#status{min-height:18px;color:#c5c9e0;font-size:12px;overflow-wrap:anywhere}.error{color:#ff9999!important}.full{width:100%}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #b5a5ff}#editor{display:block;width:100%;height:300px;touch-action:none;background-color:#323648;background-image:conic-gradient(#424658 25%,transparent 0 50%,#424658 0 75%,transparent 0);background-size:20px 20px;border:1px solid #64677e;border-radius:6px}#visual[hidden]{display:none}#editor{height:310px}[hidden]{display:none!important}#tokenName{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#size{text-align:right;font-variant-numeric:tabular-nums}</style><h1>Calibrateur <small>V1.4.1</small><button id="close" hidden style="float:right;padding:2px 9px" aria-label="Fermer">×</button></h1><p class="muted">Sélectionne un token avec la flèche Owlbear.</p><div class="row"><button id="read">Lire la sélection</button><button id="float">Fenêtre fixe</button></div><div id="visual" hidden><div class="row" style="margin-top:12px"><strong id="tokenName"></strong><span id="size" class="muted"></span></div><p class="muted" id="position" style="font-size:11px;margin:0 0 5px"></p><svg id="editor" viewBox="0 0 100 100" aria-label="Case carrée ajustable"></svg><div class="row"><button id="zoomOut">−</button><button id="fit">Recentrer</button><button id="zoomIn">+</button></div><div id="maprow" hidden><label for="map">Carte à calibrer</label><select id="map"></select></div><button class="full" id="test">Voir la grille d’essai</button><button class="full primary" id="apply" style="margin-top:6px">Appliquer à la scène</button><small>Seule la carte est ajustée, pas les tokens.</small></div><button class="full" id="undo" hidden style="margin-top:8px">Annuler la dernière calibration</button><p id="status" role="status">Connexion à Owlbear…</p><script type="module">import("./panel.js?v=141").catch(e=>{document.getElementById("status").textContent="Erreur de chargement : "+e.message;document.getElementById("status").classList.add("error")});</script></html>
