<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Google Images dans les Archives</title>
<style>body{margin:0;padding:12px;background:#fff;color:#222;font:14px/1.5 system-ui}#status{margin:4px 0 12px}button{padding:8px 14px;margin:8px 0;border:1px solid #876938;border-radius:7px;background:#fff2d7;color:#32210a;cursor:pointer}.gs-imageResult{overflow:visible!important}</style></head><body><p id="status" role="status">Chargement de Google…</p><div id="results"></div>
<script>
// Isolated sandbox: Google receives only the query and engine ID, never the GM DOM.
const params=new URLSearchParams(location.hash.slice(1)),cx=params.get('cx')||'',session=params.get('session')||'';
let pending='',records=[];
const send=(type,fields={})=>parent.postMessage({type,session,...fields},'*');
const ready=(name,query,promos,results)=>{records=results||[];document.getElementById('status').textContent=records.length?'Choisis « Utiliser cette image » sous un résultat.':'Aucune image retournée par ce moteur. Vérifie que sa recherche d’images est activée.';return false};
const rendered=(name,query,promos,elements)=>{
 for(let i=0;i<elements.length;i++){
  const result=records[i],url=result?.image?.url||result?.unescapedUrl||result?.url;
  if(typeof url!=='string'||!/^https:\/\//.test(url))continue;
  const button=document.createElement('button');button.type='button';button.textContent='Utiliser cette image';
  button.onclick=event=>{event.preventDefault();event.stopPropagation();send('archives-google-image',{url})};elements[i].append(button);
 }
};
window.__gcse={parsetags:'explicit',initializationCallback(){
 google.search.cse.element.render({div:'results',tag:'searchresults-only',gname:'archives',attributes:{enableImageSearch:true,defaultToImageSearch:true,disableWebSearch:true,mobileLayout:'disabled',linkTarget:'_self'}});
 send('archives-google-ready');if(pending)google.search.cse.element.getElement('archives').execute(pending);
},searchCallbacks:{image:{ready,rendered}}};
window.addEventListener('message',event=>{
 if(event.source!==parent||event.data?.type!=='archives-google-query'||event.data.session!==session||typeof event.data.query!=='string')return;
 pending=event.data.query.slice(0,300);window.google?.search?.cse?.element?.getElement('archives')?.execute(pending);
});
if(/^[A-Za-z0-9:_-]{5,150}$/.test(cx)){
 const script=document.createElement('script');script.async=true;script.src='https://cse.google.com/cse.js?cx='+encodeURIComponent(cx);script.onerror=()=>{document.getElementById('status').textContent='Google ne répond pas. Vérifie la connexion et l’identifiant du moteur.'};document.head.append(script);
}else document.getElementById('status').textContent='Identifiant du moteur Google absent ou invalide.';
</script></body></html>
