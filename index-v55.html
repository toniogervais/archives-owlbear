<!doctype html><html lang="fr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Les Archives</title>
<style>
:root{color-scheme:dark;font-family:"Segoe UI",system-ui,sans-serif}*{box-sizing:border-box}
body{margin:0;padding:18px;background:#18121e;color:#f2e6c6;font-size:14px}h1{font-size:17px;margin:0 0 16px}
button{display:block;width:100%;text-align:center;background:#3e2e17;border:1px solid #ba9956;border-radius:8px;color:#fff0c7;padding:14px;font:inherit;font-weight:700;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}button:focus-visible,a:focus-visible{outline:2px solid #eac985}p{font-size:13px;line-height:1.5;color:#d3be8d}a{color:#f0d796}#retry{padding:8px;margin-bottom:10px}[hidden]{display:none!important}
</style></head><body>
<h1>✦ Les Archives de l’Imaginaire</h1>
<button id="return" type="button" disabled>Afficher les Archives</button>
<p id="access-hint" role="status">Connexion à la salle Owlbear…</p>
<button id="retry" type="button" hidden>Réessayer</button>
<a id="diagnostic" href="./diagnostic.html" target="_blank" rel="noopener" hidden>Vérifier le chargement</a>
<script>
function archivesLoadingFailed(){document.getElementById('access-hint').textContent='Un fichier de l’extension n’a pas chargé. Ouvre le diagnostic de chargement pour identifier le fichier concerné.';document.getElementById('retry').hidden=false;document.getElementById('diagnostic').hidden=false;}
window.addEventListener('error',archivesLoadingFailed);
document.getElementById('retry').onclick=()=>location.reload();
</script>
<script type="module" src="./src/v55/open.mjs?v=4410" onerror="archivesLoadingFailed()"></script>
</body></html>
