<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Présentation du MJ</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif}*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#0d0913ed;color:#f5e6c8;padding:20px}
main{position:relative;width:min(100%,1000px);max-height:94dvh;overflow:auto;padding:24px;border:1px solid #bca063;border-radius:14px;background:#19121f;box-shadow:0 18px 70px #0009}
header{display:flex;align-items:center;gap:12px;justify-content:space-between}h1{margin:0;font-size:clamp(19px,3vw,27px);overflow-wrap:anywhere}p{line-height:1.5;color:#cebe9f}
button{min-height:46px;padding:10px 18px;font:inherit;color:#ffedc8;background:#403019;border:1px solid #bca063;border-radius:9px;cursor:pointer}
button:focus-visible{outline:2px solid #f1d08a;outline-offset:3px}button:disabled{opacity:.5;cursor:wait}#stage{display:grid;place-items:center;min-height:160px;gap:16px;margin:20px 0}#media{width:100%;min-width:0}
video{width:100%;max-height:62dvh;object-fit:contain;background:#050308;border-radius:8px}audio{width:min(100%,650px)}#play{font-size:20px;min-width:170px;min-height:65px}progress{width:min(100%,450px);accent-color:#c6a365;height:12px}
@media(max-width:600px){body{padding:8px}main{padding:16px}video{max-height:55dvh}}
</style></head><body><main aria-label="Média présenté par le maître de jeu">
<header><h1 id="title">Présentation du MJ</h1><button id="close" type="button" aria-label="Fermer la présentation">✕</button></header>
<p id="status" role="status" aria-live="polite">Chargement du média présenté…</p>
<div id="stage"><progress id="progress" max="100" value="0" aria-label="Chargement du média"></progress><div id="media"></div><button id="play" type="button" hidden>▶ Lire</button><button id="retry" type="button" hidden>Réessayer</button></div>
<p>Lecture sur ton appareil. Le fichier est celui que le MJ a choisi de révéler.</p>
</main><script type="module" src="./src/v60/viewer.mjs?v=4200"></script></body></html>
