<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer"><meta name="theme-color" content="#0b1519"><meta name="description" content="Compendium français Shadowrun 6 : règles, actions, équipement, PNJ et bestiaire.">
<title>Shadowrun 6 · Compendium</title><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="stylesheet" href="app.css?v=136">
</head>
<body>
<header class="masthead"><div class="brand"><img src="icon.svg" width="37" height="37" alt=""><div><span class="eyebrow">LES ARCHIVES DE L’IMAGINAIRE</span><h1>Shadowrun <b>6</b> <span>Compendium</span></h1></div></div><div class="window-tools"><button id="resizeButton" class="subtle" title="Agrandir ou réduire la fenêtre Owlbear">Agrandir</button><button id="fullscreenButton" class="subtle" title="Afficher le compendium sur tout l’écran">Plein écran</button><button id="restoreButton" class="subtle" hidden>Réduire</button><button id="booksButton" class="subtle">Mes livres <span id="libraryDot"></span></button></div></header>
<main id="app">
<section class="find" aria-label="Rechercher dans le compendium"><div class="searchbox"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6.5"/><path d="m15 15 6 6"/></svg><input id="search" type="search" aria-label="Rechercher" placeholder="Rechercher un jet, un sort, un drone, un PNJ…" autocomplete="off"><kbd>/</kbd></div><div class="filters"><select id="source" aria-label="Ouvrage"><option value="">Tous les ouvrages</option></select><select id="topic" aria-label="Thème"><option value="">Tous les thèmes</option></select><select id="category" aria-label="Famille ou habitat" hidden><option value="">Toutes les familles</option></select><button id="reset" class="iconbutton" title="Effacer les filtres" aria-label="Effacer les filtres">↺</button></div></section>
<nav id="tabs" aria-label="Types de fiches"><button id="homeButton" class="theme-tab">Thèmes</button><button data-kind="" class="active">Tout <span></span></button><button data-kind="rule">Règles <span></span></button><button data-kind="action">Actions <span></span></button><button data-kind="dice" title="Compétences, attributs, pools de D6, tests et procédures">🎲 Jets D6 <span></span></button><button data-kind="rolls">Tests par situation <span></span></button><button data-kind="equipment">Équipement <span></span></button><button data-kind="npc">PNJ <span></span></button><button data-kind="creature">Bestiaire <span></span></button><button data-kind="favorites">Favoris <span></span></button><button data-kind="mj" id="npcTab" hidden>Inventaire PNJ</button></nav>
<div id="catalogTrail" class="catalog-trail" hidden></div><div class="workspace"><aside class="results-pane" aria-label="Résultats"><div class="results-heading"><strong id="resultCount" role="status">Chargement…</strong><button id="cartButton" class="subtle" title="Ouvrir le panier d’équipement">Panier <span id="cartCount">0</span></button></div><div id="quick" class="quick"><button data-query="initiative">Initiative</button><button data-query="atout">Atout</button><button data-query="soigner un blessé">Soigner</button><button data-query="crocheter serrure">Crocheter</button><button id="situationsButton">Situations</button></div><div id="results" role="list" aria-label="Fiches correspondantes"></div><button id="more" class="more" hidden>Afficher la suite</button><div class="text-option"><label><input type="checkbox" id="practicalOnly"> Résumés, profils et données chiffrées</label><label><input type="checkbox" id="fulltext" disabled> Texte intégral des ouvrages</label></div></aside>
<article id="detail" class="detail" tabindex="-1" aria-live="polite"></article>
<aside id="cart" class="cart" aria-label="Panier d’équipement" hidden><div class="panel-title"><h2>Équipement à attribuer</h2><button id="closeCart" class="iconbutton" aria-label="Fermer le panier">×</button></div><div id="cartLines"></div><div id="cartTotal"></div><label for="targetNpc">PNJ dans la scène</label><select id="targetNpc"><option value="">Choisir un PNJ…</option></select><button id="refreshNpc" class="subtle">Actualiser les PNJ</button><button id="transfer" class="primary">Attribuer au PNJ</button><button id="copyCart" class="subtle">Copier l’inventaire</button><p id="transferStatus" role="status"></p></aside></div>
<footer><span id="coverage"></span><div><button id="glossaryButton" class="textbutton">Lexique anglais / français</button><button id="coverageButton" class="textbutton">Contenu intégré</button></div></footer>
</main>
<dialog id="booksDialog"><div class="panel-title"><h2>Mes ouvrages</h2><button data-close class="iconbutton" aria-label="Fermer">×</button></div><p id="libraryStatus"></p><label class="import-button primary">Importer HTML ou JSON<input id="importLibrary" type="file" accept=".json,.html,application/json,text/html" hidden></label><progress id="importProgress" hidden></progress><p id="importStatus" role="status"></p><div id="bookList"></div><div class="dialog-actions"><button id="exportPreferences" class="subtle">Exporter mes favoris et notes</button><label class="subtle import-button">Restaurer mes favoris et notes<input id="importPreferences" type="file" accept=".json" hidden></label><button id="removeLibrary" class="subtle">Retirer les textes de cet appareil</button></div></dialog>
<dialog id="infoDialog"><div class="panel-title"><h2 id="infoTitle"></h2><button data-close class="iconbutton" aria-label="Fermer">×</button></div><div id="infoBody"></div></dialog>
<div id="toast" role="status" hidden></div>
<script type="module" src="app.mjs?v=136"></script>
</body></html>
