name: Vérification V4.54 — fiches adaptatives et originaux directs
on:
  push:
    branches: ['codex/v454-*']
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: npx playwright install chromium
      - run: node tests/browser-v454.cjs
      - run: node tests/browser-v453.cjs
        if: ${{ !cancelled() }}
      - run: node tests/browser-v452.cjs
        if: ${{ !cancelled() }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: archives-v454-focused
          path: /tmp/archives-v454-*.png
          if-no-files-found: ignore
