name: Validation V4.66 — menu privé MJ et blessures Owlbear
on:
  push:
    branches:
      - main
      - fix/npc-only-gm-edit-wounds-v466
    paths:
      - 'src/v82/**'
      - 'src/v58/transfers.mjs'
      - 'src/v55/background.mjs'
      - 'npc-token-v82.html'
      - 'tests/npc-token-v465.test.mjs'
      - 'tests/browser-v465.cjs'
      - 'tests/owlbear-fixture.cjs'
      - '.github/workflows/verify-v466.yml'
  workflow_dispatch:
jobs:
  unitaires:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
  fiche-owlbear:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install chromium
      - run: node tests/browser-v465.cjs
  regression-transferts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install chromium
      - run: node tests/browser-v58.cjs
