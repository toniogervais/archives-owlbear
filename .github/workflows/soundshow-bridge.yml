name: SoundShow — vidéo et connecteur Windows
on:
  push:
    branches: [main, codex/soundshow-video-v1]
    paths: ['soundshow-bridge/**', 'src/soundshow/**', 'tests/*soundshow*', '.github/workflows/soundshow-bridge.yml', 'src/v55/background.mjs', 'src/v56/host.mjs', 'archives-app-v64-v55.html']
  pull_request:
    paths: ['soundshow-bridge/**', 'src/soundshow/**', 'tests/*soundshow*', '.github/workflows/soundshow-bridge.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: soundshow-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r soundshow-bridge/requirements.txt playwright
      - run: npm ci
      - run: python -m playwright install --with-deps chromium
      - run: npx playwright install chromium
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m unittest discover -s soundshow-bridge/tests -v
      - run: node --test tests/soundshow.test.mjs
      - run: python soundshow-bridge/tests/browser.py
      - run: node tests/browser-soundshow.cjs
      - run: node tests/browser-v65.cjs
      - run: node tests/browser-startup.cjs
  windows:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r soundshow-bridge/requirements.txt pyinstaller
      - name: Construire le programme autonome
        working-directory: soundshow-bridge
        run: >-
          python -m PyInstaller --noconfirm --onefile --name Archives-SoundShow-Connecteur
          --add-data "web;web"
          --add-data "../src/soundshow/protocol.mjs;."
          --add-data "../assets/peerjs-1.5.2.min.js;assets"
          --add-data "../assets/peerjs-1.5.2.LICENSE;assets"
          --add-data "LICENSE;."
          --recursive-copy-metadata aiohttp
          bridge.py
      - name: Vérifier le programme Windows
        run: python soundshow-bridge/tests/smoke_executable.py soundshow-bridge/dist/Archives-SoundShow-Connecteur.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Archives-SoundShow-Connecteur-Windows
          path: soundshow-bridge/dist/Archives-SoundShow-Connecteur.exe
          retention-days: 30
  preview:
    if: github.event_name != 'pull_request'
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Archives-SoundShow-Connecteur-Windows
          path: windows
      - name: Publier le téléchargement d’essai
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view soundshow-bridge-v0.1.3 > /dev/null 2>&1; then
            gh release create soundshow-bridge-v0.1.3 --target "$GITHUB_SHA" --prerelease --title "Connecteur SoundShow — essai 0.1.3" --notes "Ajoute un diagnostic de liaison pour les lecteurs des tablettes. Conserve la connexion SoundShow aux adresses réseau locales et le déclenchement automatique par SoundShow. Programme Windows autonome. Validation sur le matériel des joueurs encore nécessaire."
          fi
          gh release upload soundshow-bridge-v0.1.3 windows/Archives-SoundShow-Connecteur.exe --clobber
