name: Tests passerelle V4.13 Chrome Android
on:
  push:
    paths:
      - 'src/v53/**'
      - 'archives-app-v62-v53.html'
      - 'manifest-v53.json'
      - 'tests/bridge-v53.test.cjs'
      - 'tests/browser-v53.cjs'
      - 'invite-v53.html'
      - 'archives.html'
      - '.github/workflows/test-v53.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: node --test tests/bridge-v53.test.cjs tests/bridge-v52.test.cjs tests/security-v52.test.cjs
      - run: node tests/syntax.cjs
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser-v53.cjs
