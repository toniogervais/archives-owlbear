name: Test du retour direct V4.4
on:
  push:
    branches:
      - develop/archives-direct-return-v44
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Contrôle syntaxe
        run: node --check src/v44/background.mjs
      - name: Tests du retour direct
        run: node --test tests/direct-return-v44.test.cjs
