name: Tests reconnexion Archives V4.15
on:
  push:
    paths:
      - 'src/v55/**'
      - 'src/v56/**'
      - 'assets/owlbear-transfer-sdk-v55.*'
      - 'assets/peerjs-1.5.2.*'
      - 'archives-host-v55.html'
      - 'background-v55.html'
      - 'invite-v55.html'
      - 'index-v55.html'
      - 'tests/transfer-v55.test.cjs'
      - 'archives-app-v64-v55.html'
      - 'archives.html'
      - 'manifest-v55.json'
      - 'tests/bridge-v55.test.cjs'
      - 'tests/bridge-v52.test.cjs'
      - 'tests/bridge-v53.test.cjs'
      - 'tests/visual-v54.test.cjs'
      - 'tests/browser-v55.cjs'
      - 'tests/browser-v56.cjs'
      - 'tests/fallback-v56.test.mjs'
      - '.github/workflows/test-v55.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: node --test tests/fallback-v56.test.mjs tests/transfer-v55.test.cjs tests/bridge-v55.test.cjs tests/visual-v54.test.cjs tests/bridge-v53.test.cjs tests/bridge-v52.test.cjs tests/security-v52.test.cjs
      - run: node tests/syntax.cjs
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser-v55.cjs
      - run: node tests/browser-v56.cjs
