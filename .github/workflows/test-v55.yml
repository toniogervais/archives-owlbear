      - 'tests/owlbear-fixture.cjs'
      - 'tests/security-v58.test.cjs'
      - 'tests/browser-v58.cjs'
      - 'assets/owlbear-transfer-sdk-v55.*'
      - 'assets/peerjs-1.5.2.*'
      - 'archives-host-v55.html'
      - 'background-v55.html'
      - 'invite-v55.html'
