name: Vérification V4.59 — zoom, destinataires et noms des tokens
on:
  push:
    branches: ['codex/v459-*']
  workflow_dispatch:
jobs:
  units:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
  features:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        feature: [zoom, native, live]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install chromium
      - run: node tests/browser-v459.cjs ${{ matrix.feature }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: archives-v459-${{ matrix.feature }}
          path: /tmp/archives-v459-*.png
          if-no-files-found: ignore
  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - id: browser
        run: npx playwright install chromium
      - run: node tests/browser-v451.cjs
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
      - run: node tests/browser-v455.cjs
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
      - run: node tests/browser-v457.cjs
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
      - run: node tests/browser-v458.cjs
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
      - run: node tests/browser-v64.cjs
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
