name: Test barre epuree V4.9
on:
  push:
    branches:
      - develop/archives-clean-toolbar-v49
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: node --check src/v49/toolbar.js
      - run: node --test tests/toolbar-v49.test.cjs
