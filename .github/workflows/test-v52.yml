name: Tests passerelle V4.12
on:
  push:
    paths:
      - 'src/v52/**'
      - 'archives-app-v61-v52.html'
      - 'manifest-v52.json'
      - 'tests/bridge-v52.test.cjs'
      - '.github/workflows/test-v52.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: node --test tests/bridge-v52.test.cjs
      - run: node --test tests/security-v51.test.cjs
        continue-on-error: true
